name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository Hygiene & Secret Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify repository structure and documentation
        run: |
          echo "Checking essential documentation files..."
          for file in README.md PROJECT_CONTEXT.md TASKS.md AGENTS.md .gitignore .env.example; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Missing required documentation file: $file"
              exit 1
            fi
          done
          echo "All essential documentation files are present."

      - name: Verify no tracked secret files
        run: |
          echo "Verifying no private keys, keystores, or untracked .env files are committed..."
          FORBIDDEN_FILES=$(git ls-files | grep -E '(\.env$|\.env\.local$|\.keystore$|\.jks$|\.p8$|\.p12$|\.mobileprovision$)' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::Tracked sensitive files detected:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "No tracked sensitive files found."

  build-and-test:
    name: Build & Test Validation
    needs: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Detect project state
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
            echo "package.json detected."
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "No package.json detected (scaffold phase)."
          fi

      - name: Install dependencies
        if: steps.detect.outputs.has_package == 'true'
        run: |
          if [ -f "package-lock.json" ]; then
            echo "Running npm ci..."
            npm ci
          else
            echo "No package-lock.json found. Running npm install..."
            npm install
          fi

      - name: Run linter
        if: steps.detect.outputs.has_package == 'true'
        run: |
          if npm run | grep -q "^  lint$"; then
            echo "Executing npm run lint..."
            npm run lint
          else
            echo "No 'lint' script defined in package.json yet."
          fi

      - name: Run typecheck
        if: steps.detect.outputs.has_package == 'true'
        run: |
          if npm run | grep -q "^  typecheck$"; then
            echo "Executing npm run typecheck..."
            npm run typecheck
          elif [ -f "tsconfig.json" ]; then
            echo "Executing npx tsc --noEmit..."
            npx tsc --noEmit
          else
            echo "No tsconfig.json or 'typecheck' script defined yet."
          fi

      - name: Run automated tests
        if: steps.detect.outputs.has_package == 'true'
        run: |
          if npm run | grep -q "^  test$"; then
            echo "Executing npm test..."
            npm test -- --ci --maxWorkers=2
          else
            echo "No 'test' script defined in package.json yet."
          fi

      - name: Scaffold phase notice
        if: steps.detect.outputs.has_package == 'false'
        run: |
          echo "=========================================================="
          echo "Notice: Repository is currently in planning/scaffold phase."
          echo "No package.json is present on this branch yet."
          echo "CI pipeline is ready and will automatically execute"
          echo "install, lint, typecheck, and test once package.json is added."
          echo "=========================================================="
